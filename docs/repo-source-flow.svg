<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1000" viewBox="0 0 1160 1000" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
  </defs>
  <rect width="1160" height="1000" fill="#fff"/>
  <text x="40" y="45" font-size="22" font-weight="bold">How Agama (SLE-16) picks the main install source</text>
  <text x="40" y="68" fill="#666">From software/manager.rb add_base_repos and product_builder.rb set_repositories (read from source; Full-ISO case verified live on 16.0 GM)</text>

  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M210 160V200"/><path d="M210 270V310"/>
    <path d="M210 440V490"/><path d="M210 620V670"/>
    <path d="M350 375H430"/><path d="M350 555H430"/><path d="M320 710H430"/>
    <path d="M930 760V810H210V750" stroke-dasharray="6 4" stroke="#9673a6"/>
  </g>
  <path d="M740 535L640 555" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g font-style="italic"><text x="220" y="472">no</text><text x="220" y="652">no</text><text x="380" y="368">yes</text><text x="380" y="548">yes</text></g>

  <g text-anchor="middle">
    <rect x="100" y="100" width="220" height="60" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="210" y="127" font-weight="bold" font-size="14">Software probe</text><text x="210" y="147" font-size="14">add_base_repos</text>

    <rect x="100" y="200" width="220" height="70" rx="10" fill="#f5f5f5" stroke="#666"/>
    <text x="210" y="226">1. Driver-update repo</text><text x="210" y="243">(only if /run/agama/dud has one)</text><text x="210" y="260" font-style="italic">added, flow continues</text>

    <polygon points="210,310 350,375 210,440 70,375" fill="#fff2cc" stroke="#d6b656"/>
    <text x="210" y="365">2. Install media found</text><text x="210" y="382" font-weight="bold">by label?</text><text x="210" y="399" font-size="11">e.g. SLES160-x86_64</text>

    <polygon points="210,490 350,555 210,620 70,555" fill="#fff2cc" stroke="#d6b656"/>
    <text x="210" y="545">3. /run/initramfs/live/</text><text x="210" y="562">install exists?</text><text x="210" y="579" font-size="11">(Full ISO)</text>

    <rect x="100" y="670" width="220" height="80" rx="10" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="210" y="695" font-weight="bold">4. product.repositories</text><text x="210" y="713">(online repos from product YAML,</text><text x="210" y="730">or inst.install_url if set)</text>

    <rect x="430" y="335" width="210" height="80" rx="10" fill="#d5e8d4" stroke="#82b366"/>
    <text x="535" y="365" font-weight="bold">Base repo = local media</text><text x="535" y="383">hd:/?device=...</text><text x="535" y="401" font-size="11">stop here</text>
    <rect x="430" y="515" width="210" height="80" rx="10" fill="#d5e8d4" stroke="#82b366"/>
    <text x="535" y="545" font-weight="bold">Base repo = Full media</text><text x="535" y="563">/install on the live medium</text><text x="535" y="581" font-size="11">stop here</text>
    <rect x="430" y="690" width="210" height="40" rx="10" fill="#d5e8d4" stroke="#82b366"/>
    <text x="535" y="715" font-weight="bold">Base repo = online URL(s)</text>

    <rect x="740" y="660" width="380" height="100" rx="10" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="930" y="690" font-weight="bold">inst.install_url=URL[,URL2]</text><text x="930" y="710">kernel arg (launch-demo.sh: INSTALL_URL)</text>
    <text x="930" y="728">Replaces product.repositories only.</text><text x="930" y="746">Boot-time only, no API endpoint.</text>

    <rect x="740" y="470" width="380" height="130" rx="10" fill="#f8cecc" stroke="#b85450"/>
    <text x="930" y="498" font-weight="bold">Gotcha on the Full ISO</text>
    <text x="930" y="522">Steps 2 and 3 succeed first, so step 4</text><text x="930" y="540">never runs and inst.install_url is</text>
    <text x="930" y="558" font-weight="bold">ignored (verified live).</text><text x="930" y="576">Only used when no local media is found.</text>

    <rect x="40" y="850" width="1080" height="120" rx="10" fill="none" stroke="#999" stroke-dasharray="6 4"/>
    <text x="55" y="872" font-weight="bold" text-anchor="start">Afterwards: extra repositories</text>
    <rect x="70" y="890" width="300" height="60" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="220" y="915" font-weight="bold">extraRepositories</text><text x="220" y="934" font-size="12">PUT software/config, sw_add_repository, profile</text>
    <rect x="430" y="890" width="300" height="60" rx="10" fill="#f5f5f5" stroke="#666"/>
    <text x="580" y="915">Added <tspan font-weight="bold">after</tspan> the base repo,</text><text x="580" y="934">so they get higher libzypp source ids</text>
    <rect x="790" y="890" width="300" height="60" rx="10" fill="#d5e8d4" stroke="#82b366"/>
    <text x="940" y="912" font-weight="bold">Always additive</text><text x="940" y="929" font-size="12">Base repo = lowest source id; list order</text><text x="940" y="944" font-size="12">never promotes an entry to main.</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M370 920H430"/><path d="M730 920H790"/></g>
</svg>
